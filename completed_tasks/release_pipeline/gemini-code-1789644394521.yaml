name: R Package Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag Version (e.g., 0.3.4.2026.17.09.07.20)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::pkgdown, any::quarto, any::devtools

      - name: Step 3 - Run tests
        run: Rscript -e "devtools::test()"

      - name: Step 4 - Render README
        run: Rscript -e "quarto::quarto_render('README.Rmd')"

      - name: Step 6 - Document and Build Site
        run: |
          Rscript -e "devtools::document()"
          Rscript -e "pkgdown::build_site()"

      - name: Step 7 - R CMD Check
        uses: r-lib/actions/check-r-package@v2

      - name: Steps 8, 9, 10 - Commit, Tag, and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated release and build for ${{ inputs.version_tag }}" || echo "No changes to commit"
          git tag ${{ inputs.version_tag }}
          git push origin main
          git push origin main --tags
