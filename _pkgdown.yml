      - run_sas_script
      - find_sas
      - render_me
      - zip_reports
      - scan_data_io
      - read_search
      - write_search

  - title: Pipeline & Computational Graph Architecture
    desc: >
      Language-, format-, and tool-agnostic dependency graphs, file-level metadata tracking,
      and interactive DAG visualizations for reproducible biostatistical pipelines.
    contents:
      - compute_graph
      - pipeline_config
      - pipeline_summary
      - as_pipeline_graph
      - as_igraph
      - as_tbl_graph.list
      - summary.tbl_graph
      - visualize_pipeline
      - visualize_pipeline_interactive
      - print_pipeline
      - collapse_by_stage
      - export_subgraph
      - export_interactive_pipeline
      - list_stage_data_artifacts
      - controls_datasets
      - create_qmd_renderer
      - get_render_plan
      - join_pipelines
      - FilePath
      - FilePath-class
      - FileUses
      - FileUses-class
      - FileOutputs
      - FileOutputs-class

  - title: De-identification & Investigator Pseudonyms
    desc: Functions to generate synthetic investigator names and anonymize real identities for reproducible reporting.
    contents:
      - pi_anonymizer
      - generate_last_names
      - generate_pseudonym_token
      - generate_pi_names
      - anonymize_pi

  - title: Temple Brand
    desc: >
      Temple University colors, ggplot2 scales and theme, and setup for the
      quarto_temple_brand Quarto extension.
    contents:
      - temple_colors
      - temple_pal
      - scale_colour_temple
      - theme_temple
      - temple_brand_path
      - use_temple_brand

  - title: Temple CBE Themes, Decks, & Formatters
    desc: >
      Center for Biostatistics & Epidemiology ggplot2 themes, institutional cherry palettes,
      deck styling, and clinical reporting formatters.
    contents:
      - cbe_palette
      - theme_cbe
      - theme_cbe_deck
      - scale_color_cbe
      - scale_fill_cbe
      - fmt_pct
      - fmt_num
      - fmt_sig
      - fmt_p
      - fmt_hr
      - words

  - title: Univariable Cox Models & Diagnostics
    desc: >
      Univariable Cox proportional hazards screening engine with automated clinical interpretations,
      proportional hazards tests, forest plots, predicted survival curves, and marginal risk curves.
    contents:
      - cbe_cox_single
      - print.cbe_cox
      - plot_cox_forest
      - plot_cox_survival
      - plot_cox_marginal

  - title: Presentation Deck & Clinical Summary Plots
    desc: >
      Presentation-ready Kaplan-Meier curves, longitudinal biomarker trajectories,
      group comparisons, data quality audits, and 2x2 contingency tables.
    contents:
      - plot_survival_km
      - plot_dynamic_trajectory
      - plot_group_comparison
      - plot_missingness
      - table_two_by_two

  - title: Data Snapshot Manifest & Schema Engine
    desc: >
      Tools to freeze, snapshot, and verify dataset copies against upstream sources via MD5 hashes,
      enforce schema mapping dictionaries, and simulate synthetic patient cohorts.
    contents:
      - read_data_manifest
      - copy_data_manifest
      - validate_data_manifest
      - stop_if_invalid_manifest
      - validate_column_mapping
      - find_section_file
      - read_raw_table
      - read_mapped_section_data
      - summarize_section_by_time
      - demo_cbe_mapping
      - simulate_section_data

  - title: Deliverable Packaging & Code Auditing
    desc: >
      Package pipeline outputs (PDF/DOCX/HTML reports and data deliverables) into structured
      distribution archives, and audit source scripts for referenced deliverable tokens.
    contents:
      - package_deliverables
      - audit_report_deliverables

  - title: Helper & Infix Operators
    desc: Clean column naming, string matching, and vector manipulation.
    contents:
