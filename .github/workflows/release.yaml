name: R Package Release Pipeline

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (default: "auto" generates <base_ver>.YYYY.MM.DD.HHMM)'
        required: false
        default: 'auto'
        type: string
      base_version:
        description: 'Base Semver Override (e.g., 0.3.5) when version_tag is "auto"'
        required: false
        default: ''
        type: string
      run_tests:
        description: 'Step 3 - Run devtools::test()'
        required: true
        default: true
        type: boolean
      render_readme:
        description: 'Step 4 - Render README.qmd via Quarto'
        required: true
        default: true
        type: boolean
      update_description:
        description: 'Step 5 - Update Version in DESCRIPTION'
        required: true
        default: true
        type: boolean
      run_document:
        description: 'Step 6a - Run devtools::document()'
        required: true
        default: true
        type: boolean
      build_site:
        description: 'Step 6b - Build pkgdown site (can take several minutes)'
        required: true
        default: false
        type: boolean
      run_check:
        description: 'Step 7 - Run R CMD Check (can take several minutes)'
        required: true
        default: false
        type: boolean
      commit_and_push:
        description: 'Steps 8 and 10 - Commit to a branch release/<tag> and push it, for a pull request (nothing is pushed to master, no tag is made; default off)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LANGUAGE: en_US:en

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Release Version Tag
        id: resolve-version
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
        run: |
          if [ "$INPUT_VERSION_TAG" = "auto" ] || [ -z "$INPUT_VERSION_TAG" ]; then
            CURRENT_VER=$(grep "^Version:" DESCRIPTION | awk '{print $2}')
            if [ -n "$INPUT_BASE_VERSION" ]; then
              BASE_VER="$INPUT_BASE_VERSION"
            else
              BASE_VER=$(echo "$CURRENT_VER" | cut -d'.' -f1-3)
            fi
            DATE_STAMP=$(date -u +'%Y.%m.%d.%H%M')
            RELEASE_TAG="${BASE_VER}.${DATE_STAMP}"
          else
            RELEASE_TAG="$INPUT_VERSION_TAG"
          fi
          # used in a sed expression, a commit message and a branch name: a version number only
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^[0-9]+([.][0-9]+)*$'; then
            echo "::error::The release version '$RELEASE_TAG' is not a numeric version (digits and dots)"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "Computed Release Tag: $RELEASE_TAG"

      - name: Setup R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::rcmdcheck, any::pkgdown, any::quarto, any::devtools, local::.

      - name: Step 3 - Run tests
        if: ${{ inputs.run_tests }}
        run: Rscript -e "devtools::test()"

      - name: Step 4 - Render README
        if: ${{ inputs.render_readme }}
        run: Rscript -e "quarto::quarto_render('README.qmd')"

      - name: Step 5 - Update Version in DESCRIPTION
        if: ${{ inputs.update_description }}
        run: |
          sed -i "s/^Version: .*/Version: $RELEASE_TAG/" DESCRIPTION
          echo "Updated DESCRIPTION Version to: $RELEASE_TAG"

      - name: Step 6a - Document package
        if: ${{ inputs.run_document }}
        run: Rscript -e "devtools::document()"

      - name: Step 6b - Build pkgdown site
        if: ${{ inputs.build_site }}
        run: Rscript -e "pkgdown::build_site(new_process = FALSE)"

      - name: Step 7 - R CMD Check
        if: ${{ inputs.run_check }}
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      # master is protected (a pull request is required), so the release commit goes to a branch of its
      # own, release/v<tag>, and the maintainer opens the pull request. No tag is made here: it belongs on
      # the merge commit, and only the maintainer creates release tags.
      - name: Steps 8 and 10 - Commit and push a release branch
        if: ${{ inputs.commit_and_push }}
        run: |
          set -euo pipefail
          BRANCH="release/v${RELEASE_TAG}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          for f in DESCRIPTION README.md README.qmd man NAMESPACE NEWS.md; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit: no release branch was pushed."
            exit 0
          fi
          git commit -m "Automated release and build for $RELEASE_TAG"
          git push origin "$BRANCH"
          {
            echo "### Release branch pushed: \`$BRANCH\`"
            echo
            echo "Open the pull request: https://github.com/${GITHUB_REPOSITORY}/compare/master...${BRANCH}?expand=1"
            echo
            echo "After it is merged, tag the merge commit (only the maintainer creates release tags):"
            echo
            echo '```'
            echo "git fetch origin && git tag -a v${RELEASE_TAG} -m \"Release ${RELEASE_TAG}\" origin/master"
            echo "git push origin v${RELEASE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
