# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

# Read-only token; one group per pull request number (not per branch name).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: test-coverage
    # R, pandoc and the CRAN dependencies are in this image (Dockerfile.ci, built by ci-image.yml)
    container: ghcr.io/jkylearmstrong/templecbe-ci:latest
    env:
      # the repository's .Rprofile activates renv, which would hide the packages of the image (they
      # live in the site library); the container jobs run without it
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LANGUAGE: en_US:en
      TESTTHAT_PARALLEL: "FALSE"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # tools that the r-lib actions call; the CI image gets them with the next image build (Dockerfile.ci)
      - name: Install jq and friends if the image lacks them
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends jq unzip wget gnupg lsb-release xz-utils file
          fi

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::readr
            any::jquerylib
            any::caret
          needs: check

      - name: Environment report (what the tests can use)
        run: |
          d <- read.dcf("DESCRIPTION", fields = c("Imports", "Suggests"))
          pk <- unique(trimws(sub("[(].*", "", unlist(strsplit(gsub("
", " ", d), ",")))))
          pk <- pk[nzchar(pk) & !is.na(pk) & pk != "R"]
          cat("declared but not loadable:", paste(pk[!vapply(pk, requireNamespace, logical(1), quietly = TRUE)], collapse = ", "), "
")
          print(Sys.which(c("pandoc", "quarto", "pdflatex", "git", "sas")))
          cat(".libPaths():
"); print(.libPaths())
          cat(system2("pandoc", "--version", stdout = TRUE)[1], "
")
        shell: Rscript {0}

      - name: Test coverage
        run: |
          Sys.setenv(R_LIBS_SITE = paste(.libPaths(), collapse = .Platform$path.sep))
          Sys.setenv(R_LIBS_USER = paste(.libPaths(), collapse = .Platform$path.sep))
          tryCatch({
            cov <- covr::package_coverage(
              quiet = FALSE,
              clean = FALSE,
              clobber = FALSE,
              install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
            )
            covr::to_cobertura(cov)
          }, error = function(e) {
            cat("\n=== covr::package_coverage() FAILED ===\n")
            cat("Error message:", conditionMessage(e), "\n")
            rout_files <- list.files(Sys.getenv("RUNNER_TEMP"), pattern = "testthat\\.Rout.*", recursive = TRUE, full.names = TRUE)
            for (f in rout_files) {
              cat("\n--- Content of", f, "---\n")
              cat(readLines(f, warn = FALSE), sep = "\n")
            }
            stop(e)
          })
        shell: Rscript {0}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/**/testthat.Rout*

