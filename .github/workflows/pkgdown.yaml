# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LANGUAGE: en_US:en
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.

      - name: Restore renv
        continue-on-error: true
        run: |
          tryCatch({
            if (file.exists("renv.lock")) {
              dir.create("~/.cache/R/renv", recursive = TRUE, showWarnings = FALSE)
              renv::restore(prompt = FALSE)
            }
          }, error = function(e) {
            message("renv::restore notice: ", conditionMessage(e))
          })
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        # the site is built from master or a published release only (a manual run from another
        # branch would otherwise replace the public site)
        if: github.ref == 'refs/heads/master' || github.event_name == 'release'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          # one commit on gh-pages (single_commit is not an input of the action and was ignored)
          force_orphan: true
          keep_files: false
