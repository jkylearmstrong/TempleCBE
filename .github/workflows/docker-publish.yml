name: Docker

on:
  workflow_run:
    workflows: ["R-CMD-check"]
    branches: [master]
    types:
      - completed
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Each architecture is built on a native runner (no QEMU emulation) and pushed by
# digest; the merge job then stitches the digests into one multi-arch manifest.
# Tag builds (v*) and manual runs on a tag publish linux/amd64 + linux/arm64
# (arm64 is what DGX Spark / Grace runs); every other build is amd64 only.

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select platforms
        id: matrix
        run: |
          AMD='{"platform":"linux/amd64","pair":"linux-amd64","runner":"ubuntu-latest"}'
          ARM='{"platform":"linux/arm64","pair":"linux-arm64","runner":"ubuntu-24.04-arm"}'
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "matrix={\"include\":[${AMD},${ARM}]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[${AMD}]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ env.DOCKERHUB_USER == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      # Computed per job: a job output containing the Docker Hub user name would be
      # dropped by GitHub as a possible secret.
      - name: Configure Docker image targets
        id: images
        run: |
          if [ -n "$DOCKERHUB_USER" ]; then
            IMAGES="${DOCKERHUB_USER}/templecbe"
          else
            IMAGES="ghcr.io/${{ github.repository_owner }}/templecbe"
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.images }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.images.outputs.images }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.pair }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ env.DOCKERHUB_USER == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      # Computed per job: a job output containing the Docker Hub user name would be
      # dropped by GitHub as a possible secret.
      - name: Configure Docker image targets
        id: images
        run: |
          if [ -n "$DOCKERHUB_USER" ]; then
            IMAGES="${DOCKERHUB_USER}/templecbe"
          else
            IMAGES="ghcr.io/${{ github.repository_owner }}/templecbe"
          fi
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.images.outputs.images }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ steps.images.outputs.images }}:${{ steps.meta.outputs.version }}"
