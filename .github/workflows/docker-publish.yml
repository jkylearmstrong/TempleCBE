name: Docker

on:
  workflow_run:
    workflows: ["R-CMD-check"]
    branches: [master]
    types:
      - completed
  push:
    # release tags only (v0.6.3, v0.7.0-rc1); the date-stamped development tags made by
    # scripts/deploy_release.R (v0.4.45.2026.09.30.0123) are not valid semver and build nothing
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

# No permissions by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # a workflow_run for a failed R-CMD-check is skipped by the job conditions below, but it
  # still enters this group first: it must not cancel a good build that is already running
  cancel-in-progress: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

# Each architecture is built on a native runner (no QEMU emulation) and pushed by digest; the
# merge job then stitches the digests into one multi-architecture manifest. Every build covers
# linux/amd64 and linux/arm64 (arm64 is what DGX Spark / Grace runs), so `latest` is never an
# amd64-only image.
#
# What is published:
#   - master (after R-CMD-check succeeds on its tip): `master` and `latest`
#   - a release tag that is on master: the version (`0.6.3`), never `latest`
#   - with Docker Hub credentials, the same tags are copied to GHCR (ghcr.io/<owner>/templecbe)
#   - a manual run from any other branch: built to check that the image builds, nothing is pushed
# A run for a commit that is no longer the master tip is skipped.

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      run: ${{ steps.decide.outputs.run }}
      publish: ${{ steps.decide.outputs.publish }}
      build_sha: ${{ steps.decide.outputs.build_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to build and whether to publish
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          master_tip=$(git rev-parse origin/master)
          build_sha="$GITHUB_SHA"
          run=true
          publish=false
          on_master() { git merge-base --is-ancestor "$1" origin/master; }
          case "$EVENT_NAME" in
            workflow_run)
              build_sha="$RUN_HEAD_SHA"
              if [ "$RUN_HEAD_SHA" = "$master_tip" ]; then
                publish=true
              else
                echo "::notice::R-CMD-check ran on $RUN_HEAD_SHA, which is no longer the master tip ($master_tip); nothing to build"
                run=false
              fi ;;
            push)
              if on_master "$GITHUB_SHA"; then publish=true
              else echo "::error::tag $GITHUB_REF_NAME is not on master; nothing is published"; exit 1; fi ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" = "refs/heads/master" ]; then
                publish=true
              elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                if on_master "$GITHUB_SHA"; then publish=true
                else echo "::error::tag $GITHUB_REF_NAME is not on master; nothing is published"; exit 1; fi
              else
                echo "::notice::$GITHUB_REF is not master or a release tag: building to check the image, nothing is pushed"
              fi ;;
          esac
          {
            echo "run=$run"
            echo "publish=$publish"
            echo "build_sha=$build_sha"
            echo 'matrix={"include":[{"platform":"linux/amd64","pair":"linux-amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","pair":"linux-arm64","runner":"ubuntu-24.04-arm"}]}'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.run == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # the environment holds DOCKERHUB_TOKEN and only master and v* tags may use it; a build that
    # does not publish (a manual run from another branch) uses no environment and no token
    environment: ${{ needs.prepare.outputs.publish == 'true' && 'dockerhub' || '' }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.build_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The registry is computed per job (not passed as a job output: a value containing the Docker
      # Hub user name is dropped by GitHub as a possible secret). The user name may be a repository
      # variable or a secret; the secrets are only given to this step and to the login step.
      - name: Configure registry
        id: registry
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ] && [ -n "$DOCKERHUB_USER" ] && [ -z "$DOCKERHUB_PASS" ]; then
            echo "::error::A Docker Hub user name is set but DOCKERHUB_TOKEN is not"; exit 1
          fi
          if [ -z "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASS" ]; then
            echo "::error::DOCKERHUB_TOKEN is set but no Docker Hub user name is"; exit 1
          fi
          if [ -n "$DOCKERHUB_USER" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "images=${DOCKERHUB_USER}/templecbe" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "images=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/templecbe" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: ${{ needs.prepare.outputs.publish == 'true' && steps.registry.outputs.dockerhub != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ needs.prepare.outputs.publish == 'true' && steps.registry.outputs.dockerhub == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # only for the version label of the image; the tags are set by the merge job
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ steps.registry.outputs.images }}
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ needs.prepare.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.registry.outputs.images) || 'type=cacheonly' }}
          # The layer cache lives in the registry, not in the Actions cache: with mode=max it wrote
          # about 5 GB per run, which filled the repository's 10 GB Actions cache and evicted the R
          # package cache that R-CMD-check, test-coverage and pkgdown depend on (an R-CMD-check run
          # then spent an hour reinstalling R and its packages and timed out). Reading it needs no
          # login; only a publishing run (master or a release tag) writes it.
          cache-from: type=registry,ref=${{ steps.registry.outputs.images }}:buildcache-${{ matrix.pair }}
          cache-to: ${{ needs.prepare.outputs.publish == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', steps.registry.outputs.images, matrix.pair) || '' }}

      - name: Export digest
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dockerhub
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Configure registry
        id: registry
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USER" ] && [ -z "$DOCKERHUB_PASS" ]; then
            echo "::error::A Docker Hub user name is set but DOCKERHUB_TOKEN is not"; exit 1
          fi
          if [ -z "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASS" ]; then
            echo "::error::DOCKERHUB_TOKEN is set but no Docker Hub user name is"; exit 1
          fi
          if [ -n "$DOCKERHUB_USER" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "images=${DOCKERHUB_USER}/templecbe" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "images=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/templecbe" >> "$GITHUB_OUTPUT"
          fi

      # GHCR is logged in to in every case: it is the primary registry without Docker Hub
      # credentials and the mirror with them (see "Mirror to GHCR" below).
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.registry.outputs.dockerhub == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` only from master (the newest commit), never from a tag: tagging an older release
      # must not move it back. A release tag publishes its version only.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ steps.registry.outputs.images }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Require at least one tag
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          if [ -z "$(jq -r '.tags[]?' <<< "$META_JSON")" ]; then
            echo "::error::No image tag was derived for $GITHUB_REF (is it a valid release version?); the pushed digests stay untagged"
            exit 1
          fi

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGES: ${{ steps.registry.outputs.images }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGES}@sha256:%s " *)

      # With Docker Hub as the primary registry, the same multi-architecture manifest is copied to
      # GHCR under the same tags, so `docker pull ghcr.io/<owner>/templecbe:<tag>` works on the
      # DGX Spark (arm64) as well as on amd64. The copy is made from the image just pushed to Docker
      # Hub (no rebuild), so both registries hold the same digest. A new GHCR package is private
      # until its visibility is set to public once (Package settings), which GITHUB_TOKEN cannot do.
      - name: Mirror to GHCR
        if: ${{ steps.registry.outputs.dockerhub == 'true' }}
        env:
          IMAGES: ${{ steps.registry.outputs.images }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/templecbe"
          for ref in $(jq -r '.tags[]' <<< "$TAGS_JSON"); do
            tag="${ref##*:}"
            docker buildx imagetools create -t "${ghcr}:${tag}" "${ref}"
            docker buildx imagetools inspect "${ghcr}:${tag}" | grep -E "linux/(amd64|arm64)"
          done

      - name: Inspect image
        env:
          IMAGES: ${{ steps.registry.outputs.images }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGES}:${VERSION}"
