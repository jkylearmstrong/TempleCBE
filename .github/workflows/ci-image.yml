# Builds the CI base image (Dockerfile.ci) for linux/amd64 and linux/arm64 on native runners and
# publishes it to GHCR as ghcr.io/<owner>/templecbe-ci:latest (and a dated tag). The CI jobs run
# in this image so that they do not reinstall R and every dependency on each run.
#
# A pull request that changes Dockerfile.ci or this file builds the image without publishing it.
# Publishing happens on master (DESCRIPTION, Dockerfile.ci or this file changed), every Monday
# (to pick up new CRAN releases) and on a manual run from master.
name: ci-image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile.ci
      - DESCRIPTION
      - .github/workflows/ci-image.yml
  pull_request:
    branches: [master]
    paths:
      - Dockerfile.ci
      - .github/workflows/ci-image.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      image: ${{ steps.decide.outputs.image }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          publish=false
          if [ "$EVENT" != pull_request ] && [ "$REF" = refs/heads/master ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/templecbe-ci" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    timeout-minutes: 90
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {platform: linux/amd64, pair: linux-amd64, runner: ubuntu-latest}
          - {platform: linux/arm64, pair: linux-arm64, runner: ubuntu-24.04-arm}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: Dockerfile.ci
          platforms: ${{ matrix.platform }}
          outputs: ${{ needs.prepare.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.prepare.outputs.image) || 'type=cacheonly' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.pair }}
          cache-to: ${{ needs.prepare.outputs.publish == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max,image-manifest=true,oci-mediatypes=true', needs.prepare.outputs.image, matrix.pair) || '' }}

      - name: Export digest
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          stamp=$(date -u +%Y%m%d)
          docker buildx imagetools create -t "${IMAGE}:latest" -t "${IMAGE}:${stamp}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: docker buildx imagetools inspect "${IMAGE}:latest"
