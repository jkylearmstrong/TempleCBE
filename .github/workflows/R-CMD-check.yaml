# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run full cross-platform matrix (Windows & macOS)'
        required: false
        type: boolean
        default: true

# Read-only token for every job (a check never writes to the repository).
permissions:
  contents: read

# One group per pull request number (not per branch name: a fork's branch named like a maintainer's
# would cancel the other's checks).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: R-CMD-check

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    # pull-request runs of this job take 29 minutes (13 on a master push) and were cancelled at 30
    timeout-minutes: 60
    name: ubuntu-latest (release)
    # R, pandoc and the CRAN dependencies are in this image (Dockerfile.ci, built by ci-image.yml);
    # setup-r installing R through apt took 10-19 minutes on a slow mirror. The package must be public.
    container: ghcr.io/jkylearmstrong/templecbe-ci:latest
    env:
      # the repository's .Rprofile activates renv, which would hide the packages of the image (they
      # live in the site library); the container jobs run without it
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LANGUAGE: en_US:en
      TESTTHAT_PARALLEL: "FALSE"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # tools that the r-lib actions call; the CI image gets them with the next image build (Dockerfile.ci)
      - name: Install jq and friends if the image lacks them
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends jq unzip wget gnupg lsb-release xz-utils file
          fi

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'

  cross-platform-check:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 75

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    env:
      LANG: ${{ matrix.config.locale }}
      LC_ALL: ${{ matrix.config.locale }}
      LANGUAGE: en_US:en
      TESTTHAT_PARALLEL: "FALSE"

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest,  r: 'release', locale: English_United States.utf8, check_args: 'c("--no-manual", "--ignore-vignettes")', build_args: 'c("--no-build-vignettes")'}
          - {os: macOS-latest,    r: 'release', locale: en_US.UTF-8,                check_args: 'c("--no-manual")',                          build_args: 'character()'}
          # aarch64 Linux (same CPU architecture as DGX Spark / Grace). Posit Package
          # Manager serves arm64 binaries for Ubuntu noble, so dependencies install in a few
          # minutes, as on x86-64.
          - {os: ubuntu-24.04-arm, r: 'release', locale: C.UTF-8,                   check_args: 'c("--no-manual")',                          build_args: 'character()'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # apt on the GitHub-hosted Ubuntu runners reads packages from azure.archive.ubuntu.com, which was
      # throttled on 2026-10-23: installing R and the system libraries took 20-40 minutes and the jobs
      # were cancelled at their limits. archive.ubuntu.com downloaded the same packages in minutes
      # (the Docker builds use it).
      - name: Use the main Ubuntu package mirror
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/\?|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          grep -rhE '^(URIs|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -5 || true

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          upload-snapshots: true
          args: ${{ matrix.config.check_args }}
          build_args: ${{ matrix.config.build_args }}

  optional-deps-installed-tests:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 40
    name: optional-tests-${{ matrix.config.os }}
    # the Linux x86-64 entry runs in the CI image (see sanity-check); the others have no container
    container: ${{ matrix.config.container }}
    env:
      # the repository's .Rprofile activates renv, which would hide the packages of the image (they
      # live in the site library); the container jobs run without it
      RENV_CONFIG_AUTOLOADER_ENABLED: ${{ matrix.config.container && 'FALSE' || 'TRUE' }}
      LANG: ${{ matrix.config.locale }}
      LC_ALL: ${{ matrix.config.locale }}
      LANGUAGE: en_US:en
      TESTTHAT_PARALLEL: "FALSE"

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  locale: C.UTF-8, container: 'ghcr.io/jkylearmstrong/templecbe-ci:latest'}
          - {os: windows-latest, locale: English_United States.utf8}
          - {os: ubuntu-24.04-arm, locale: C.UTF-8}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # apt on the GitHub-hosted Ubuntu runners reads packages from azure.archive.ubuntu.com, which was
      # throttled on 2026-10-23: installing R and the system libraries took 20-40 minutes and the jobs
      # were cancelled at their limits. archive.ubuntu.com downloaded the same packages in minutes
      # (the Docker builds use it).
      - name: Use the main Ubuntu package mirror
        if: ${{ runner.os == 'Linux' && runner.arch == 'X64' && !matrix.config.container }}
        run: |
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu/\?|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          grep -rhE '^(URIs|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -5 || true

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: ${{ !matrix.config.container }}
        with:
          r-version: release
          use-public-rspm: true

      # tools that the r-lib actions call; the CI image gets them with the next image build (Dockerfile.ci)
      - name: Install jq and friends if the image lacks them
        if: ${{ matrix.config.container != '' }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends jq unzip wget gnupg lsb-release xz-utils file
          fi

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
            any::pkgload
            any::future
            any::furrr
            any::missForest
            any::missRanger
            local::.
          needs: test

      - name: Install package into library (no load_all)
        run: |
          remotes::install_local(".", upgrade = "never", dependencies = FALSE, build_vignettes = FALSE, quiet = TRUE)
        shell: Rscript {0}

      - name: Run multisession optional-dependency tests against installed package
        run: |
          testthat::test_dir(
            "tests/testthat",
            filter = "missforest-mtry|missranger-mtry",
            package = "TempleCBE",
            reporter = "summary",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
