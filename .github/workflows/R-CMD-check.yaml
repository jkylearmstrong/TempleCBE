# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    env:
      LANG: ${{ matrix.config.locale }}
      LC_ALL: ${{ matrix.config.locale }}
      LANGUAGE: en_US:en

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release', locale: C.UTF-8}
          - {os: windows-latest,  r: 'release', locale: English_United States.utf8}
          - {os: macOS-latest,    r: 'release', locale: en_US.UTF-8}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  optional-deps-installed-tests:
    runs-on: ${{ matrix.config.os }}
    name: optional-tests-${{ matrix.config.os }}
    env:
      LANG: ${{ matrix.config.locale }}
      LC_ALL: ${{ matrix.config.locale }}
      LANGUAGE: en_US:en

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  locale: C.UTF-8}
          - {os: windows-latest, locale: English_United States.utf8}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
            any::pkgload
            any::future
            any::furrr
            any::missForest
            any::missRanger
            local::.
          needs: test

      - name: Install package into library (no load_all)
        run: |
          remotes::install_local(".", upgrade = "never", dependencies = FALSE, build_vignettes = FALSE, quiet = TRUE)
        shell: Rscript {0}

      - name: Run multisession optional-dependency tests against installed package
        run: |
          testthat::test_dir(
            "tests/testthat",
            filter = "missforest-mtry|missranger-mtry",
            package = "TempleCBE",
            reporter = "summary",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
