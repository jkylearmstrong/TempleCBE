# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run full cross-platform matrix (Windows & macOS)'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

name: R-CMD-check

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ubuntu-latest (release)
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LANGUAGE: en_US:en
      TESTTHAT_PARALLEL: "FALSE"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'

  cross-platform-check:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    env:
      LANG: ${{ matrix.config.locale }}
      LC_ALL: ${{ matrix.config.locale }}
      LANGUAGE: en_US:en
      TESTTHAT_PARALLEL: "FALSE"

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest,  r: 'release', locale: English_United States.utf8, check_args: 'c("--no-manual", "--ignore-vignettes")', build_args: 'c("--no-build-vignettes")'}
          - {os: macOS-latest,    r: 'release', locale: en_US.UTF-8,                check_args: 'c("--no-manual")',                          build_args: 'character()'}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: ${{ matrix.config.check_args }}
          build_args: ${{ matrix.config.build_args }}

  optional-deps-installed-tests:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 15
    name: optional-tests-${{ matrix.config.os }}
    env:
      LANG: ${{ matrix.config.locale }}
      LC_ALL: ${{ matrix.config.locale }}
      LANGUAGE: en_US:en
      TESTTHAT_PARALLEL: "FALSE"

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  locale: C.UTF-8}
          - {os: windows-latest, locale: English_United States.utf8}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::remotes
            any::pkgload
            any::future
            any::furrr
            any::missForest
            any::missRanger
            local::.
          needs: test

      - name: Install package into library (no load_all)
        run: |
          remotes::install_local(".", upgrade = "never", dependencies = FALSE, build_vignettes = FALSE, quiet = TRUE)
        shell: Rscript {0}

      - name: Run multisession optional-dependency tests against installed package
        run: |
          testthat::test_dir(
            "tests/testthat",
            filter = "missforest-mtry|missranger-mtry",
            package = "TempleCBE",
            reporter = "summary",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
